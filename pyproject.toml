[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magicsquare-4x4"
version = "0.1.0"
description = "MagicSquare 4x4 TDD practice project"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
]

[tool.setuptools.packages.find]
include = ["boundary*", "control*", "entity*", "magicsquare*"]

